kind = "web"
previewPath = "/"
title = "Nexio — Transforming Businesses Through Technology"
version = "1.0.0"
id = "artifacts/nexio-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23684

[services.development]
run = "pnpm --filter @workspace/nexio-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexio-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexio-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23684"
BASE_PATH = "/"
